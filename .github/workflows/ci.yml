name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - uses: jdx/mise-action@v5
        with:
          install: false

      - name: Pi compatibility gate
        run: npm run check:pi-compatibility
